[project]
name = "genbase-rag"
version = "0.1.0"
description = "GenBase FAQ retrieval plugin for Dingent"
requires-python = ">=3.12,<3.14"
dependencies = [
    "chromadb>=1.0,<2",
    "fastembed>=0.6,<1",
    "mcp[cli]>=1.9,<2",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9",
]

[project.scripts]
genbase-rag-ingest = "genbase_rag.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genbase_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 180
target-version = "py312"
